<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-white dark:bg-surface border-b border-bebe dark:border-outline-variant transition-colors duration-200 ease-in-out"><div class="flex flex-col items-center w-full max-w-[1440px] mx-auto px-page-margin py-sm relative"><div class="flex items-center w-full relative"><button class="absolute left-0 p-sm -ml-sm rounded-full hover:bg-faint transition-colors text-on-background"><span class="material-symbols-outlined">arrow_back</span></button><div class="flex-1 flex flex-col items-center text-center"><h1 class="font-heading-sm text-heading-sm text-on-background">Identity Verification</h1><p class="font-caption text-caption text-secondary">Step 2 of 3</p></div></div><div class="flex gap-1 mt-2 w-full max-w-[120px]"><div class="h-1 flex-1 rounded-full bg-on-background"></div><div class="h-1 flex-1 rounded-full bg-on-background"></div><div class="h-1 flex-1 rounded-full bg-bebe"></div></div></div></header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-20 mb-[100px] flex justify-center w-full px-page-margin py-section-gap max-w-[1440px] mx-auto">
<div class="w-full max-w-lg flex flex-col gap-xl">
<!-- Header Section -->
<div class="flex flex-col gap-sm text-center md:text-left">
<h2 class="font-heading-lg text-heading-lg text-on-background">Select your ID type</h2>
<p class="font-body text-body text-secondary">We need a government-issued photo ID to verify your identity. Your information is encrypted and stored securely.</p>
</div>
<!-- ID Type Selection Form -->
<form class="flex flex-col gap-md" id="id-selection-form">
<!-- Option: Passport -->
<label class="flex items-center justify-between p-lg rounded-xl border border-deco cursor-pointer hover:border-on-background transition-colors bg-white group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-secondary group-hover:text-on-background transition-colors">description</span>
<span class="font-ui-label text-ui-label text-on-background">Passport</span>
</div>
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-6 h-6 border-2 border-surface-dim rounded-full checked:border-on-background checked:border-[6px] transition-all cursor-pointer" name="id_type" type="radio" value="passport">
</div>
</label>
<!-- Option: Driver's license -->
<label class="flex items-center justify-between p-lg rounded-xl border border-deco cursor-pointer hover:border-on-background transition-colors bg-white group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-secondary group-hover:text-on-background transition-colors">drive_eta</span>
<span class="font-ui-label text-ui-label text-on-background">Driver's license</span>
</div>
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-6 h-6 border-2 border-surface-dim rounded-full checked:border-on-background checked:border-[6px] transition-all cursor-pointer" name="id_type" type="radio" value="drivers_license">
</div>
</label>
<!-- Option: National ID card -->
<label class="flex items-center justify-between p-lg rounded-xl border border-deco cursor-pointer hover:border-on-background transition-colors bg-white group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-secondary group-hover:text-on-background transition-colors">badge</span>
<span class="font-ui-label text-ui-label text-on-background">National ID card</span>
</div>
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-6 h-6 border-2 border-surface-dim rounded-full checked:border-on-background checked:border-[6px] transition-all cursor-pointer" name="id_type" type="radio" value="national_id">
</div>
</label>
</form>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 w-full z-50 bg-white border-t border-bebe py-lg px-page-margin flex justify-center">
<div class="w-full max-w-lg flex justify-between items-center">
<button class="font-ui-label text-ui-label text-secondary hover:text-on-background transition-colors underline decoration-solid decoration-1 underline-offset-4">
                How identity verification works
            </button>
<button class="bg-on-background text-white rounded-full px-8 py-4 font-ui-label text-ui-label opacity-50 cursor-not-allowed transition-all hover:bg-inverse-surface disabled:hover:bg-on-background" disabled="" id="continue-btn">
                Continue
            </button>
</div>
</div>
<script>
        const form = document.getElementById('id-selection-form');
        const continueBtn = document.getElementById('continue-btn');
        const radioButtons = form.querySelectorAll('input[type="radio"]');
        const labels = form.querySelectorAll('label');

        radioButtons.forEach(radio => {
            radio.addEventListener('change', () => {
                if (form.querySelector('input[name="id_type"]:checked')) {
                    continueBtn.disabled = false;
                    continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    continueBtn.classList.add('active:scale-95');
                }
                
                // Optional: visual highlighting of selected row
                labels.forEach(l => l.classList.remove('border-on-background', 'bg-faint'));
                if(radio.checked) {
                    radio.closest('label').classList.add('border-on-background', 'bg-faint');
                }
            });
        });
    </script>


</body></html>

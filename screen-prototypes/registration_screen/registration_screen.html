<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-surface text-on-surface font-body h-screen flex flex-col items-center selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Container (Mobile Constrained) -->
<main class="w-full max-w-[480px] h-full flex flex-col bg-white overflow-y-auto px-lg sm:px-page-margin relative shadow-xl">
<!-- Header Section -->
<header class="w-full py-xl flex flex-col gap-lg sticky top-0 bg-white z-10">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors -ml-sm">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-heading-lg text-heading-lg text-on-surface">Create your account</h1>
<!-- Segmented Control for Role -->
<div class="flex p-xs bg-surface-container-low rounded-lg border border-bebe mt-sm relative isolate w-full max-w-[300px]">
<div class="absolute inset-y-xs left-xs w-[calc(50%-4px)] bg-white rounded-md shadow-sm transition-transform duration-300 ease-in-out border border-bebe -z-10" id="role-selector-bg"></div>
<button class="flex-1 py-sm font-ui-label text-ui-label text-on-surface text-center rounded-md transition-colors" id="role-seeker" onclick="setRole('seeker')">Seeker</button>
<button class="flex-1 py-sm font-ui-label text-ui-label text-secondary text-center rounded-md transition-colors" id="role-agent" onclick="setRole('agent')">Agent</button>
</div>
</header>
<!-- Form Section -->
<form class="flex-1 flex flex-col gap-lg pb-xl mt-md" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div class="flex flex-col gap-sm">
<label class="font-ui-label text-ui-label text-on-surface" for="fullName">Full name</label>
<div class="relative">
<input class="w-full rounded-lg border border-bebe bg-white px-md py-md font-body text-body text-on-surface placeholder:text-grey-500 focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-shadow" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-sm">
<label class="font-ui-label text-ui-label text-on-surface" for="email">Email</label>
<div class="relative">
<input class="w-full rounded-lg border border-bebe bg-white px-md py-md font-body text-body text-on-surface placeholder:text-grey-500 focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-shadow" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-sm">
<label class="font-ui-label text-ui-label text-on-surface" for="password">Password</label>
<div class="relative">
<input class="w-full rounded-lg border border-bebe bg-white pl-md pr-12 py-md font-body text-body text-on-surface placeholder:text-grey-500 focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-shadow" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-md text-secondary hover:text-on-surface transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined" id="password-icon" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-baseline">
<label class="font-ui-label text-ui-label text-on-surface" for="phone">Phone number</label>
<span class="font-caption text-caption text-secondary" id="phone-optional-label">Optional</span>
</div>
<div class="relative">
<input class="w-full rounded-lg border border-bebe bg-white px-md py-md font-body text-body text-on-surface placeholder:text-grey-500 focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-shadow" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<p class="font-caption text-caption text-secondary hidden" id="phone-agent-note">Required for Agent accounts.</p>
</div>
<!-- Spacer to push button to bottom -->
<div class="flex-1 min-h-[32px]"></div>
<!-- Footer Actions -->
<div class="flex flex-col gap-md pt-lg border-t border-surface-container-high mt-auto">
<button class="w-full bg-primary-container text-on-primary-container font-ui-label text-ui-label py-md rounded-full opacity-50 cursor-not-allowed transition-opacity hover:opacity-90 active:scale-[0.98]" disabled="" id="submit-btn" type="submit">
                    Create account
                </button>
<p class="font-caption text-caption text-secondary text-center px-lg">
                    By continuing, you agree to our 
                    <a class="text-primary hover:underline underline-offset-2" href="#">Terms</a> and 
                    <a class="text-primary hover:underline underline-offset-2" href="#">Privacy Policy</a>
</p>
<p class="font-body text-body text-on-surface text-center mt-sm">
                    Already have an account? 
                    <a class="text-primary font-ui-label text-ui-label hover:underline underline-offset-2 ml-xs" href="#">Log in</a>
</p>
</div>
</form>
</main>
<script>
        // Segmented Control Logic
        function setRole(role) {
            const selectorBg = document.getElementById('role-selector-bg');
            const seekerBtn = document.getElementById('role-seeker');
            const agentBtn = document.getElementById('role-agent');
            const phoneOptionalLabel = document.getElementById('phone-optional-label');
            const phoneAgentNote = document.getElementById('phone-agent-note');

            if (role === 'agent') {
                selectorBg.style.transform = 'translateX(100%)';
                
                seekerBtn.classList.remove('text-on-surface');
                seekerBtn.classList.add('text-secondary');
                
                agentBtn.classList.remove('text-secondary');
                agentBtn.classList.add('text-on-surface');

                phoneOptionalLabel.classList.add('hidden');
                phoneAgentNote.classList.remove('hidden');
            } else {
                selectorBg.style.transform = 'translateX(0)';
                
                agentBtn.classList.remove('text-on-surface');
                agentBtn.classList.add('text-secondary');
                
                seekerBtn.classList.remove('text-secondary');
                seekerBtn.classList.add('text-on-surface');

                phoneOptionalLabel.classList.remove('hidden');
                phoneAgentNote.classList.add('hidden');
            }
        }

        // Password Visibility Toggle
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('password-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                passwordIcon.textContent = 'visibility_off';
            }
        }

        // Basic form validation to enable/disable button visually
        const inputs = document.querySelectorAll('input');
        const submitBtn = document.getElementById('submit-btn');

        inputs.forEach(input => {
            input.addEventListener('input', () => {
                const name = document.getElementById('fullName').value.trim();
                const email = document.getElementById('email').value.trim();
                const pass = document.getElementById('password').value.trim();
                
                if (name && email && pass.length >= 6) {
                    submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    submitBtn.classList.add('opacity-100');
                    submitBtn.removeAttribute('disabled');
                } else {
                    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    submitBtn.classList.remove('opacity-100');
                    submitBtn.setAttribute('disabled', 'true');
                }
            });
        });
    </script>
</body></html>

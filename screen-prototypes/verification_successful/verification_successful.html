<body class="flex flex-col min-h-screen">

<!-- Action Button -->
<button class="w-full sm:w-auto px-12 py-4 bg-primary text-white font-ui-label text-ui-label rounded-full hover:bg-rausch-600 transition-all duration-300 active:scale-95 shadow-md shadow-primary/10">

</div>
</div>

<script>
        // Atmospheric Micro-interaction: Subtle floating confetti effect on entry
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#ba0036', '#e21e4a', '#ffb2b6', '#f2f0f0'];
            
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                const size = Math.random() * 8 + 4;
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                confetti.style.position = 'absolute';
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';
                confetti.style.backgroundColor = color;
                confetti.style.borderRadius = '2px';
                confetti.style.top = '-20px';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.opacity = Math.random();
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                container.appendChild(confetti);
                
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 2;
                
                confetti.animate([
                    { transform: `translateY(0) rotate(0deg)`, opacity: 1 },
                    { transform: `translateY(${window.innerHeight + 20}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    delay: delay * 1000,
                    easing: 'cubic-bezier(.37,0,.63,1)',
                    fill: 'forwards'
                });

                // Cleanup
                setTimeout(() => confetti.remove(), (duration + delay) * 1000);
            }
        }

        // Trigger confetti on page load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(createConfetti, 300);
        });

        // Button interaction
        const continueBtn = document.querySelector('button');
        continueBtn.addEventListener('click', () => {
            continueBtn.innerHTML = '<span class="flex items-center gap-2"><svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Loading...</span>';
            setTimeout(() => {
                // Mock redirect
                console.log('Redirecting to next booking step...');
            }, 800);
        });
    </script>

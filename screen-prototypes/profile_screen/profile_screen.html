        body { font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-surface h-screen flex flex-col antialiased selection:bg-rausch-600 selection:text-white overflow-hidden">
<!-- TopAppBar -->
<header class="flex items-center justify-between p-4 bg-surface border-b border-bebe shrink-0 h-16">
<div class="w-8"></div> <!-- Spacer for centering -->
<h1 class="text-heading-sm font-semibold flex-1 text-center">Profile</h1>
<div class="w-8"></div> <!-- Spacer for centering -->
</header>
<!-- Main Scrollable Content -->
<main class="flex-1 overflow-y-auto w-full">
<div class="max-w-3xl mx-auto w-full flex flex-col pt-8 pb-32">
<!-- User Identity -->
<section class="flex flex-col items-center gap-4 px-4 mb-8">
<div class="relative w-32 h-32 rounded-full bg-secondary-fixed flex items-center justify-center text-4xl font-bold text-on-surface shadow-sm">
                    JD
                </div>
<div class="flex flex-col items-center gap-2">
<h2 class="text-heading-lg font-bold">Jane Doe</h2>
<span class="px-3 py-1 rounded-full bg-surface-variant text-on-surface text-caption font-semibold">Seeker</span>
</div>
</section>
<!-- Settings List -->
<section class="px-4">
<div class="border-t border-bebe">
<!-- Edit Profile -->
<a class="flex items-center justify-between py-5 border-b border-bebe group active:bg-surface-container-low transition-colors" href="#">
<span class="text-ui-label text-on-surface">Edit profile</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface transition-colors">chevron_right</span>
</a>
<!-- Phone Number -->
<a class="flex items-center justify-between py-5 border-b border-bebe group active:bg-surface-container-low transition-colors" href="#">
<span class="text-ui-label text-on-surface">Phone number</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface transition-colors">chevron_right</span>
</a>
<!-- Notifications -->
<a class="flex items-center justify-between py-5 border-b border-bebe group active:bg-surface-container-low transition-colors" href="#">
<span class="text-ui-label text-on-surface">Notifications</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface transition-colors">chevron_right</span>
</a>
<!-- Help and support -->
<a class="flex items-center justify-between py-5 border-b border-bebe group active:bg-surface-container-low transition-colors" href="#">
<span class="text-ui-label text-on-surface">Help and support</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface transition-colors">chevron_right</span>
</a>
</div>
</section>
<!-- Footer Section -->
<section class="px-4 mt-8">
<div class="border-t border-bebe pt-4">
<button class="flex items-center gap-3 py-4 w-full text-left group active:opacity-70 transition-opacity">
<span class="material-symbols-outlined text-rausch-600">logout</span>
<span class="text-ui-label text-rausch-600 font-semibold">Log out</span>
</button>
</div>
</section>
</div>
</main>
<!-- BottomNavBar (Shared Component, logic applied: destination screen -> show nav) -->
<nav class="fixed bottom-0 left-0 right-0 z-50 flex gap-2 border-t border-bebe bg-surface px-4 pb-safe pt-2 h-[80px] pb-4">
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-on-surface transition-colors" href="#">

</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-on-surface transition-colors" href="#">

</a>

<span class="material-symbols-outlined text-[24px]">map</span>
<span class="text-[10px] font-medium leading-none">Trips</span>
</a>

<span class="material-symbols-outlined text-[24px]">chat_bubble</span>
<span class="text-[10px] font-medium leading-none">Inbox</span>
</a>

<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-[10px] font-semibold leading-none">Profile</span>
</a>

        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }

<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #e2dfde; border-radius: 9999px; }

    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col pt-20 pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full h-20 border-b border-bebe dark:border-outline-variant bg-white dark:bg-on-surface flex items-center justify-between px-page-margin max-w-[1440px] mx-auto z-40 transition-transform cursor-pointer active:scale-95">
<div class="flex items-center space-x-md text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</div>
<div class="font-heading-sm text-heading-sm font-bold text-on-surface dark:text-inverse-on-surface">
            Step 1 of 4
        </div>
<div class="w-6"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center px-page-margin w-full max-w-3xl mx-auto mt-section-gap space-y-section-gap">
<!-- Header Section -->
<div class="w-full space-y-sm">
<h1 class="font-heading-lg text-heading-lg text-on-surface">Let's start with the basics</h1>
<p class="font-body text-body text-secondary">Tell us a bit about your place so we can categorize it correctly.</p>
</div>
<!-- Form Container -->
<form class="w-full space-y-xl">
<!-- Listing Title -->
<div class="space-y-sm">
<label class="font-ui-label text-ui-label text-on-surface" for="listing-title">Listing Title</label>
<input class="w-full rounded-lg border border-bebe bg-white px-md py-md font-body text-body text-on-surface focus:border-rausch-600 focus:ring-1 focus:ring-rausch-600 transition-colors placeholder:text-grey-500" id="listing-title" placeholder="e.g. Modern Studio in Gulshan" type="text"/>
</div>
<!-- Description -->
<div class="space-y-sm">
<label class="font-ui-label text-ui-label text-on-surface" for="listing-description">Description</label>
<textarea class="w-full rounded-lg border border-bebe bg-white px-md py-md font-body text-body text-on-surface focus:border-rausch-600 focus:ring-1 focus:ring-rausch-600 transition-colors placeholder:text-grey-500 resize-none" id="listing-description" placeholder="Describe your property..." rows="4"></textarea>
</div>
<!-- Category Selector (Pills) -->
<div class="space-y-md">
<label class="font-ui-label text-ui-label text-on-surface">Property Type</label>
<div class="flex flex-wrap gap-md">
<!-- Active Pill -->
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="property-type" type="radio" value="studio"/>
<div class="px-xl py-sm rounded-full border border-bebe bg-white text-secondary font-ui-label text-ui-label transition-colors peer-checked:bg-secondary peer-checked:text-white peer-checked:border-secondary hover:bg-surface-container-low">
                            Studio
                        </div>
</label>
<!-- Inactive Pills -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="property-type" type="radio" value="1-bed"/>
<div class="px-xl py-sm rounded-full border border-bebe bg-white text-secondary font-ui-label text-ui-label transition-colors peer-checked:bg-secondary peer-checked:text-white peer-checked:border-secondary hover:bg-surface-container-low">
                            1-bed flat
                        </div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="property-type" type="radio" value="portion"/>
<div class="px-xl py-sm rounded-full border border-bebe bg-white text-secondary font-ui-label text-ui-label transition-colors peer-checked:bg-secondary peer-checked:text-white peer-checked:border-secondary hover:bg-surface-container-low">
                            Portion
                        </div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="property-type" type="radio" value="shared"/>
<div class="px-xl py-sm rounded-full border border-bebe bg-white text-secondary font-ui-label text-ui-label transition-colors peer-checked:bg-secondary peer-checked:text-white peer-checked:border-secondary hover:bg-surface-container-low">
                            Shared
                        </div>
</label>
</div>
</div>
<!-- Numeric Selectors (Bedrooms & Bathrooms) -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-xl border-t border-bebe pt-xl mt-xl">
<!-- Bedrooms -->
<div class="flex items-center justify-between">
<span class="font-ui-label text-ui-label text-on-surface">Bedrooms</span>
<div class="flex items-center space-x-md">
<button class="w-8 h-8 rounded-full border border-bebe flex items-center justify-center text-secondary hover:border-on-surface hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-size: 18px;">remove</span>
</button>
<span class="font-body text-body w-4 text-center">1</span>
<button class="w-8 h-8 rounded-full border border-bebe flex items-center justify-center text-secondary hover:border-on-surface hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-size: 18px;">add</span>
</button>
</div>
</div>
<!-- Bathrooms -->
<div class="flex items-center justify-between">
<span class="font-ui-label text-ui-label text-on-surface">Bathrooms</span>
<div class="flex items-center space-x-md">
<button class="w-8 h-8 rounded-full border border-bebe flex items-center justify-center text-secondary hover:border-on-surface hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-size: 18px;">remove</span>
</button>
<span class="font-body text-body w-4 text-center">1</span>
<button class="w-8 h-8 rounded-full border border-bebe flex items-center justify-center text-secondary hover:border-on-surface hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-size: 18px;">add</span>
</button>
</div>
</div>
</div>
</form>
</main>
<!-- Fixed Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full px-page-margin py-lg flex justify-between items-center bg-white border-t border-bebe z-50">
<button class="font-ui-label text-ui-label text-on-surface underline hover:opacity-80 transition-opacity">Back</button>
<button class="bg-rausch-600 text-on-primary font-ui-label text-ui-label rounded-full px-xl py-md hover:opacity-90 transition-opacity active:scale-95">Continue</button>
</div>
<!-- Script for interactive elements (optional micro-interactions) -->
<script>
        document.querySelectorAll('button[type="button"]').forEach(button => {
            button.addEventListener('click', function() {
                const isAdd = this.querySelector('.material-symbols-outlined').innerText === 'add';
                const countSpan = this.parentElement.querySelector('.text-center');
                let count = parseInt(countSpan.innerText);
                
                if (isAdd) {
                    count++;
                } else {
                    if (count > 0) count--;
                }
                countSpan.innerText = count;
                
                // Micro-interaction
                this.classList.add('bg-surface-container-low');
                setTimeout(() => this.classList.remove('bg-surface-container-low'), 150);
            });
        });
    </script>
</body></html>

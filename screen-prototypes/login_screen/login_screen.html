<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body">
<!-- TopAppBar -->
<header class="fixed top-0 w-full flex justify-between items-center px-page-margin h-20 bg-surface z-50">
<button class="text-secondary hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center p-sm -ml-sm">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-heading-sm text-heading-sm text-primary tracking-tight">Estate Ease</div>
<div class="w-10"></div> <!-- Spacer to center wordmark -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center items-center px-page-margin pt-20 pb-section-gap max-w-md mx-auto w-full">
<div class="w-full space-y-xl">
<div class="space-y-sm text-center md:text-left pt-section-gap">
<h1 class="font-heading-lg text-heading-lg text-on-surface">Welcome back.</h1>
</div>
<form class="space-y-lg w-full">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-ui-label text-ui-label text-on-surface block" for="email">Email</label>
<input class="w-full rounded-lg border-bebe bg-white px-lg py-md font-body text-body text-on-surface placeholder-grey-500 focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none" id="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-ui-label text-ui-label text-on-surface block" for="password">Password</label>
</div>
<div class="relative">
<input class="w-full rounded-lg border-bebe bg-white px-lg py-md font-body text-body text-on-surface placeholder-grey-500 focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none pr-12" id="password" placeholder="Password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center px-md text-secondary hover:text-on-surface transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<div class="flex justify-end pt-sm">
<a class="font-ui-label text-ui-label text-on-surface hover:opacity-80 transition-opacity" href="#">Forgot password?</a>
</div>
</div>
<!-- Log In Button -->
<button class="w-full bg-rausch-600 hover:opacity-90 active:scale-95 transition-all text-white font-ui-label text-ui-label py-md rounded-full mt-xl flex items-center justify-center h-12 shadow-sm" type="submit">
                    Log in
                </button>
</form>
<!-- Divider -->
<div class="flex items-center justify-center space-x-md py-md">
<div class="h-px bg-bebe flex-grow"></div>
<span class="font-body text-body text-secondary">or</span>
<div class="h-px bg-bebe flex-grow"></div>
</div>
<!-- Social Login -->
<button class="w-full border border-on-surface hover:bg-faint active:scale-95 transition-all text-on-surface font-ui-label text-ui-label py-md rounded-lg flex items-center justify-center space-x-md h-12" type="button">
<!-- Using a generic google icon replacement since actual SVG isn't provided, keeping it clean -->
<span class="material-symbols-outlined" data-icon="g_mobiledata">g_mobiledata</span>
<span>Continue with Google</span>
</button>
</div>
</main>
<!-- Footer Action -->
<footer class="mt-auto py-xl text-center w-full pb-xl">
<p class="font-body text-body text-on-surface">
            Don't have an account? <a class="text-rausch-600 font-ui-label text-ui-label hover:opacity-80 transition-opacity" href="#">Sign up</a>
</p>
</footer>
<script>
        document.getElementById('togglePassword').addEventListener('click', function (e) {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('span');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            }
        });
    </script>
</body></html>

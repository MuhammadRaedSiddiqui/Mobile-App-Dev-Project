<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Identity Verification | Estate Ease</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary": "#5f5e5e",
                    "white": "#ffffff",
                    "surface-container": "#efeded",
                    "secondary-container": "#e2dfde",

                    "surface-container-highest": "#e4e2e2",
                    "tertiary-container": "#008558",
                    "on-primary-fixed": "#40000d",
                    "outline": "#906f70",
                    "on-tertiary-fixed": "#002113",
                    "inverse-primary": "#ffb2b6",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed-variant": "#474746",
                    "surface": "#fbf9f8",
                    "primary-container": "#e21e4a",
                    "deco": "#dddddd",
                    "rausch-600": "#e00b41",
                    "on-background": "#1b1c1c",
                    "background": "#fbf9f8",
                    "on-secondary-fixed": "#1b1c1c",
                    "secondary-fixed": "#e5e2e1",
                    "grey-500": "#c1c1c1",
                    "on-surface-variant": "#5c3f41",
                    "tertiary-fixed-dim": "#62dca3",
                    "on-secondary-container": "#636262",
                    "surface-container-lowest": "#ffffff",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#f2f0f0",
                    "tertiary": "#006a45",
                    "surface-container-high": "#e9e8e7",
                    "on-tertiary-fixed-variant": "#005234",
                    "error-container": "#ffdad6",
                    "surface-tint": "#be0038",
                    "bebe": "#ebebeb",
                    "surface-container-low": "#f5f3f3",
                    "secondary-fixed-dim": "#c8c6c5",
                    "faint": "#f7f7f7",
                    "tertiary-fixed": "#80f9bd",
                    "surface-bright": "#fbf9f8",
                    "error": "#ba1a1a",
                    "on-primary-fixed-variant": "#920029",
                    "inverse-surface": "#303031",
                    "primary-fixed": "#ffdada",
                    "primary-fixed-dim": "#ffb2b6",
                    "on-tertiary-container": "#f6fff6",
                    "on-surface": "#1b1c1c",
                    "outline-variant": "#e5bdbe",
                    "surface-dim": "#dbdad9",
                    "on-primary": "#ffffff",
                    "on-error-container": "#93000a",
                    "rausch": "#ff385c",
                    "hof": "#222222",
                    "foggy": "#6a6a6a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "lg": "16px",
                    "xs": "4px",
                    "xl": "24px",
                    "page-margin": "40px",
                    "md": "12px",
                    "section-gap": "48px",
                    "sm": "8px",
                    "unit": "4px"
            },
            "fontFamily": {
                    "ui-label": ["Plus Jakarta Sans"],
                    "caption": ["Plus Jakarta Sans"],
                    "subheading": ["Plus Jakarta Sans"],
                    "body": ["Plus Jakarta Sans"],

                    "heading-lg": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "ui-label": ["16px", {"lineHeight": "1.25", "letterSpacing": "normal", "fontWeight": "500"}],
                    "caption": ["11px", {"lineHeight": "1.18", "letterSpacing": "normal", "fontWeight": "600"}],
                    "subheading": ["20px", {"lineHeight": "1.2", "letterSpacing": "-0.009em", "fontWeight": "600"}],
                    "body": ["14px", {"lineHeight": "1.43", "letterSpacing": "normal", "fontWeight": "400"}],
                    "heading-sm": ["22px", {"lineHeight": "1.18", "letterSpacing": "-0.02em", "fontWeight": "500"}],
                    "heading-lg": ["28px", {"lineHeight": "1.43", "letterSpacing": "normal", "fontWeight": "700"}]
            }
          },
        },
      }

<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-white text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white dark:bg-surface border-b border-bebe dark:border-outline-variant">
<div class="flex items-center h-20 px-page-margin max-w-[1440px] mx-auto">
<span class="font-heading-sm text-heading-sm text-on-surface dark:text-white">Estate Ease</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-page-margin pt-20 pb-32">
<div class="max-w-md w-full text-center flex flex-col items-center">
<!-- Alert Graphic -->
<div class="mb-xl">
<div class="w-24 h-24 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-[48px] text-foggy" data-icon="warning">warning</span>
</div>
</div>
<!-- Heading -->
<h1 class="font-heading-sm text-heading-sm text-hof mb-md">
                Verification incomplete
            </h1>
<!-- Supporting Text -->
<p class="font-body text-body text-foggy mb-section-gap max-w-[320px]">
                We couldn't verify your identity. This usually happens if the photo was unclear or the document is unsupported. Don't worry, you can try again.
            </p>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-md">
<button class="w-full bg-rausch text-white font-ui-label text-ui-label py-lg rounded-full shadow-sm hover:opacity-90 transition-all active:scale-[0.98]">
                    Try again
                </button>
<button class="w-full border border-hof text-hof font-ui-label text-ui-label py-lg rounded-lg hover:bg-faint transition-colors active:scale-[0.98]">
                    Contact support
                </button>
</div>
</div>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 w-full z-50 bg-white dark:bg-surface border-t border-bebe dark:border-outline-variant">
<div class="flex justify-between items-center py-lg px-page-margin max-w-[1440px] mx-auto">
<div class="font-caption text-caption text-secondary">
                © 2024 RentalApp Identity Services
            </div>
<div class="flex gap-xl">
<a class="font-body text-body text-secondary dark:text-secondary-fixed hover:opacity-90 transition-transform" href="#">Privacy Policy</a>
<a class="font-body text-body text-secondary dark:text-secondary-fixed hover:opacity-90 transition-transform" href="#">Terms of Service</a>
</div>
</div>
</footer>
<!-- Micro-interaction for buttons -->
<script>
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.transform = 'scale(0.96)';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = 'scale(1)';
            });
            button.addEventListener('mouseleave', () => {
                button.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>

<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<style>
        /* Custom range slider styling */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            pointer-events: all;
            width: 24px;
            height: 24px;
            background-color: white;
            border: 2px solid #e00b41;
            border-radius: 50%;
            cursor: pointer;
        }
        input[type=range]::-moz-range-thumb {
            pointer-events: all;
            width: 24px;
            height: 24px;
            background-color: white;
            border: 2px solid #e00b41;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .toggle-checkbox:checked {
            right: 0;
            border-color: #e00b41;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #e00b41;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body antialiased">
<!-- Dimmed Background Overlay -->
<div aria-hidden="true" class="fixed inset-0 bg-on-background/50 z-40 transition-opacity"></div>
<!-- Bottom Sheet -->
<div class="fixed inset-x-0 bottom-0 z-50 flex flex-col h-[663px] bg-surface rounded-t-[24px] shadow-xl overflow-hidden transform transition-transform duration-300 ease-in-out translate-y-0 w-full max-w-[1440px] mx-auto">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-sm pb-md">
<div class="w-12 h-1 bg-deco rounded-full"></div>
</div>
<!-- Header -->
<header class="flex items-center justify-between px-xl pb-md border-b border-bebe">
<button class="text-body font-body text-on-surface hover:text-primary transition-colors" type="button">Reset</button>
<h1 class="text-ui-label font-ui-label font-semibold text-on-surface">Filters</h1>
<button class="text-on-surface hover:bg-faint p-2 rounded-full transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</header>
<!-- Scrollable Content -->
<main class="flex-1 overflow-y-auto p-xl space-y-[32px]">
<!-- Budget Section -->
<section>
<h2 class="text-subheading font-subheading mb-lg">Budget</h2>
<p class="text-body font-body text-on-surface mb-md">PKR 20,000 – 60,000</p>
<div class="relative w-full h-8">
<!-- Slider track (background) -->
<div class="absolute top-1/2 left-0 w-full h-1 bg-bebe -translate-y-1/2 rounded-full"></div>
<!-- Slider track (active) - positioned with inline styles for demonstration -->
<div class="absolute top-1/2 left-[20%] right-[40%] h-1 bg-rausch-600 -translate-y-1/2 rounded-full"></div>
<!-- Dual Range inputs (overlapping) -->
<input class="absolute top-1/2 w-full -translate-y-1/2 appearance-none bg-transparent pointer-events-none z-20" max="100000" min="0" type="range" value="20000"/>
<input class="absolute top-1/2 w-full -translate-y-1/2 appearance-none bg-transparent pointer-events-none z-20" max="100000" min="0" type="range" value="60000"/>
</div>
</section>
<!-- Category Section -->
<section>
<h2 class="text-subheading font-subheading mb-lg">Category</h2>
<div class="flex flex-wrap gap-sm">
<button class="px-lg py-sm rounded-full border-2 border-on-surface bg-on-surface text-white text-body font-body transition-colors">1-bed flats</button>
<button class="px-lg py-sm rounded-full border border-bebe bg-white text-on-surface hover:border-on-surface transition-colors text-body font-body">Portions</button>
<button class="px-lg py-sm rounded-full border border-bebe bg-white text-on-surface hover:border-on-surface transition-colors text-body font-body">Shared / roommate</button>
<button class="px-lg py-sm rounded-full border border-bebe bg-white text-on-surface hover:border-on-surface transition-colors text-body font-body">Studios</button>
</div>
</section>
<!-- City / Area Section -->
<section>
<h2 class="text-subheading font-subheading mb-lg">City / area</h2>
<div class="relative">
<input class="w-full pl-lg pr-xl py-md rounded-lg border border-bebe bg-white text-body font-body placeholder:text-grey-500 focus:outline-none focus:border-on-surface focus:ring-1 focus:ring-on-surface transition-colors" placeholder="e.g. Gulshan, PECHS" type="text"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface">expand_more</span>
</div>
</section>
<!-- Toggle Section -->
<section class="flex items-start justify-between pb-[100px]"> <!-- Extra padding for fixed bottom bar -->
<div>
<h3 class="text-ui-label font-ui-label text-on-surface mb-unit">Only show fresh listings</h3>
<p class="text-caption font-caption text-secondary font-normal">Hides listings unverified for 14+ days</p>
</div>
<!-- Toggle Switch -->
<div class="relative inline-block w-12 h-6 align-middle select-none transition duration-200 ease-in mt-1">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-bebe appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out" id="toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-rausch-600 cursor-pointer transition-colors duration-200 ease-in-out" for="toggle"></label>
</div>
</section>
</main>
<!-- Fixed Bottom Action -->
<footer class="absolute bottom-0 w-full px-xl py-lg bg-surface border-t border-bebe z-10 pb-[env(safe-area-inset-bottom)]">
<button class="w-full bg-rausch-600 text-white rounded-lg py-md text-ui-label font-ui-label font-semibold hover:bg-primary transition-colors">
                Show 23 results
            </button>
</footer>
</div>
</body></html>

<style>
        .custom-radio {
            appearance: none;
            background-color: transparent;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.5em;
            height: 1.5em;
            border: 1.5px solid #6a6a6a; /* foggy */
            border-radius: 50%;
            display: grid;
            place-content: center;
        }

        .custom-radio::before {
            content: "";
            width: 0.75em;
            height: 0.75em;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em var(--radio-color, #222222); /* hof */
        }

        .custom-radio:checked::before {
            transform: scale(1);
        }

        .custom-radio:checked {
            border-color: #222222; /* hof */
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-faint text-hof font-cereal min-h-screen flex flex-col pt-20 pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white border-b border-bebe flat no shadows">
<div class="flex items-center justify-between px-page-margin h-20 max-w-[1440px] mx-auto">
<button aria-label="Close" class="w-10 h-10 flex items-center justify-center hover:bg-faint transition-colors rounded-full text-hof active:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 400;">close</span>
</button>
<h1 class="font-cereal text-[16px] font-semibold text-hof text-center flex-1">Report a concern</h1>
<button aria-label="Help" class="w-10 h-10 flex items-center justify-center hover:bg-faint transition-colors rounded-full text-hof active:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 400;">help</span>
</button>
</div>
<!-- Progress Bar -->
<div class="w-full bg-bebe h-1 absolute bottom-0 left-0">
<div class="bg-hof h-1 w-1/4 transition-all duration-300"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 max-w-[720px] mx-auto w-full px-page-margin md:px-page-margin pt-section-gap">
<!-- Heading -->
<h2 class="font-cereal text-[32px] leading-tight font-semibold text-hof mb-lg">Why are you reporting this listing?</h2>
<!-- Privacy Block -->
<div class="bg-white border border-bebe rounded-xl p-lg flex items-start gap-md mb-xl">
<span class="material-symbols-outlined text-hof" style="font-variation-settings: 'wght' 300;">lock</span>
<p class="font-cereal text-[14px] text-foggy">Your report is confidential. We won't share this with the host.</p>
</div>
<!-- Selection List -->
<div class="flex flex-col bg-white border border-bebe rounded-xl overflow-hidden">
<label class="flex items-center justify-between p-lg border-b border-bebe cursor-pointer group hover:bg-faint transition-colors">
<span class="font-cereal text-[16px] text-hof">Inaccurate or incorrect listing info</span>
<input class="custom-radio" name="report_reason" type="radio" value="inaccurate"/>
</label>
<label class="flex items-center justify-between p-lg border-b border-bebe cursor-pointer group hover:bg-faint transition-colors">
<span class="font-cereal text-[16px] text-hof">Not a real place to stay</span>
<input class="custom-radio" name="report_reason" type="radio" value="fake"/>
</label>
<label class="flex items-center justify-between p-lg border-b border-bebe cursor-pointer group hover:bg-faint transition-colors">
<span class="font-cereal text-[16px] text-hof">It's a scam</span>
<input class="custom-radio" name="report_reason" type="radio" value="scam"/>
</label>
<label class="flex items-center justify-between p-lg border-b border-bebe cursor-pointer group hover:bg-faint transition-colors">
<span class="font-cereal text-[16px] text-hof">Offensive content</span>
<input class="custom-radio" name="report_reason" type="radio" value="offensive"/>
</label>
<label class="flex items-center justify-between p-lg cursor-pointer group hover:bg-faint transition-colors">
<span class="font-cereal text-[16px] text-hof">Something else</span>
<input class="custom-radio" name="report_reason" type="radio" value="other"/>
</label>
</div>
</main>
<!-- BottomNavBar -->
<footer class="fixed bottom-0 left-0 w-full flex justify-between items-center px-page-margin py-md bg-white border-t border-bebe flat no shadows z-50">
<div class="max-w-[720px] mx-auto w-full flex justify-between items-center">
<button class="flex items-center justify-center text-hof px-lg py-md hover:bg-faint transition-colors active:scale-95 transition-transform rounded-full font-cereal text-[16px] font-semibold underline">
                Back
            </button>
<button class="flex items-center justify-center bg-rausch text-white rounded-full px-[32px] py-[14px] font-semibold font-cereal text-[16px] hover:opacity-90 transition-opacity active:scale-95 transition-transform">
                Next
            </button>
</div>
</footer>

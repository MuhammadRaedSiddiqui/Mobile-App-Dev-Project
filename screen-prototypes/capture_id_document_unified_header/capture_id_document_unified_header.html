<style>
        .camera-overlay {
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }
        
        .corner-marker {
            width: 24px;
            height: 24px;
            border-color: #ffffff;
            border-style: solid;
            position: absolute;
        }
        
        .corner-tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-top-left-radius: 12px; }
        .corner-tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; border-top-right-radius: 12px; }
        .corner-bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; border-bottom-left-radius: 12px; }
        .corner-br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-bottom-right-radius: 12px; }

        .pulsate {
            animation: pulsate 2s infinite ease-in-out;
        }

        @keyframes pulsate {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
    </style>

<body class="h-full bg-inverse-surface text-white font-body selection:bg-primary-container selection:text-white flex flex-col relative overflow-hidden">
<!-- Top Navigation (Modified from JSON for camera context) -->
<header class="fixed top-0 left-0 right-0 z-50 bg-black/40 backdrop-blur-sm"><div class="max-w-md mx-auto px-page-margin py-4 flex flex-col gap-md">
    <div class="flex items-center justify-between">
        <button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors text-white">
            <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <div class="flex flex-col items-center">
            <h1 class="text-white font-heading-sm text-heading-sm">Identity Verification</h1>
            <span class="text-white/70 font-caption text-caption">Step 3 of 3</span>
        </div>
        <div class="w-10"></div>
    </div>
    <div class="flex gap-1 h-1">
        <div class="flex-1 bg-white rounded-full"></div>
        <div class="flex-1 bg-white rounded-full"></div>
        <div class="flex-1 bg-white rounded-full"></div>
    </div>
</div></header>
<!-- Camera Viewport / Main Content -->
<main class="flex-1 relative flex flex-col items-center justify-center w-full h-full">
<!-- Placeholder for Camera Feed -->
<div class="absolute inset-0 w-full h-full bg-inverse-surface z-0">
<div class="bg-cover bg-center w-full h-full opacity-40" data-alt="A simulated, slightly blurred perspective of a modern, bright office desk viewed through a camera lens, providing context for scanning a document. The lighting is neutral and even, perfect for high-quality document capture in a professional setting." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBSIUZPEbYr4TePQZmzNieHIbdZUyDeYIoz4i5ekKavh_iSUj0yojR51TNHd2lp_8Hyb22XYirdTbyBLHZkGpqBs2Hgx5O_p-DrdQcRPMeeKbidr0LfV0ONGqzJbfr8LSKWIkujmESU5nCUK_GrmQKtqdxCFO4T1v9MVzVGEfuOP4S53stykFqeLMIUo5V8oM7nArqXQVe_0YGHzHi8CD_tf7WEojX37weH_pj7wcuujOaAZ-m63yhqjA')"></div>
</div>
<!-- Instructional Overlay Text -->
<div class="absolute top-24 left-0 w-full px-page-margin text-center z-20 flex flex-col gap-sm">
<h1 class="font-heading-lg text-heading-lg text-white">Scan your document</h1>
<p class="font-body text-body text-white/80 max-w-md mx-auto">
                Position your ID within the frame. Ensure it is well-lit and all details are clearly visible.
            </p>
</div>
<!-- Viewfinder Frame -->
<div class="relative w-[340px] h-[214px] rounded-xl z-20 mt-12 transition-all duration-300">
<!-- Semi-transparent overlay outside the frame -->
<div class="absolute inset-0 rounded-xl camera-overlay z-[-1] pointer-events-none" style="box-shadow: rgba(0, 0, 0, 0.6) 0px 0px 0px 9999px;"></div>
<!-- Clear cutout area -->
<div class="w-full h-full rounded-xl border border-white/30 backdrop-blur-[1px]"></div>
<!-- Corner Markers -->
<div class="corner-marker corner-tl" style="border-color: rgb(128, 249, 189);"></div>
<div class="corner-marker corner-tr" style="border-color: rgb(128, 249, 189);"></div>
<div class="corner-marker corner-bl" style="border-color: rgb(128, 249, 189);"></div>
<div class="corner-marker corner-br" style="border-color: rgb(128, 249, 189);"></div>
<!-- Real-time feedback badge -->
<div class="absolute -bottom-16 left-1/2 transform -translate-x-1/2 bg-surface-container/90 backdrop-blur-md rounded-full px-lg py-sm flex items-center gap-sm shadow-lg transition-opacity duration-300" id="feedback-badge">
<span class="material-symbols-outlined text-primary text-sm pulsate" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-ui-label text-ui-label text-on-surface">ID detected - hold still</span>
</div>
</div>
</main>
<!-- Bottom Controls -->
<footer class="absolute bottom-0 left-0 w-full pb-xl pt-lg px-page-margin bg-gradient-to-t from-black/80 to-transparent z-50 flex flex-col items-center gap-xl">
<!-- Shutter Button -->
<button aria-label="Take photo" class="relative w-20 h-20 rounded-full border-[3px] border-white flex items-center justify-center hover:scale-105 active:scale-95 transition-transform duration-200">
<div class="w-[68px] h-[68px] bg-white rounded-full"></div>
</button>
<!-- Fallback Link -->
<button class="font-ui-label text-ui-label text-white hover:text-white/80 underline decoration-white/40 underline-offset-4 transition-colors">
            Upload photo manually
        </button>
</footer>
<script>
        // Simple simulation for real-time feedback appearance
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const badge = document.getElementById('feedback-badge');
                if(badge) {
                    badge.classList.remove('opacity-0');
                    // Add subtle green tint to frame to indicate success
                    document.querySelector('.camera-overlay').style.boxShadow = '0 0 0 9999px rgba(0, 0, 0, 0.6)';
                    const corners = document.querySelectorAll('.corner-marker');
                    corners.forEach(c => c.style.borderColor = '#80f9bd'); // tertiary-fixed color
                }
            }, 3000);
        });
    </script>
